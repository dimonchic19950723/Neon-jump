<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0620" />
    <title>NEON JUMP</title>
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; min-height: 100%; background: #0b0620; color: #fff; }
      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        font-family: system-ui, -apple-system, sans-serif;
        background:
          radial-gradient(circle at 50% 15%, rgba(217,70,239,.22), transparent 38%),
          radial-gradient(circle at 85% 85%, rgba(34,211,238,.15), transparent 35%),
          #0b0620;
      }
      main {
        width: min(420px, 100%);
        padding: 32px;
        text-align: center;
        border: 1px solid rgba(255,255,255,.13);
        border-radius: 28px;
        background: rgba(255,255,255,.06);
        box-shadow: 0 24px 80px rgba(0,0,0,.45);
      }
      .logo {
        width: 68px; height: 68px; margin: 0 auto 20px;
        display: grid; place-items: center;
        border-radius: 22px;
        font-size: 34px;
        background: linear-gradient(135deg,#22d3ee,#8b5cf6,#d946ef);
        box-shadow: 0 0 38px rgba(217,70,239,.4);
      }
      h1 { margin: 0; font-size: 25px; letter-spacing: .08em; }
      p { margin: 12px 0 24px; color: rgba(255,255,255,.58); line-height: 1.6; font-size: 14px; }
      button {
        width: 100%; border: 0; border-radius: 15px; padding: 14px 18px;
        color: white; font-size: 14px; font-weight: 800; cursor: pointer;
        background: linear-gradient(90deg,#06b6d4,#8b5cf6,#d946ef);
      }
    </style>
  </head>
  <body>
    <main>
      <div class="logo">🚀</div>
      <h1>NEON JUMP</h1>
      <p>
        Игра не смогла подключиться к серверу. Проверь интернет и повтори попытку.
        Если экран появился при сборке APK, проверь переменную CAPACITOR_SERVER_URL.
      </p>
      <button onclick="location.reload()">Повторить</button>
    </main>
  </body>
</html>
